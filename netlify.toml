# Netlify сам определяет Next.js и подключает @netlify/plugin-nextjs.
# Здесь только то, что нельзя оставлять на усмотрение платформы.

[build]
  command = "npm run build"

[build.environment]
  # Next.js 16 требует Node 20.9+. Пиним LTS явно, чтобы сборка не поехала,
  # когда Netlify сменит версию по умолчанию.
  NODE_VERSION = "22"

# Планируемая функция синхронизации объявляет своё расписание сама —
# экспортом `config.schedule` в netlify/functions/sync-cron.mts.
# Дублировать его здесь не нужно: два источника правды разъедутся.
